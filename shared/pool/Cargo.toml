[package]
name = "shared-pool"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"

# Disk free-space probe used by the PoolBudget disk-free floor.
fs2 = "0.4"

# Per-backend pool_used / pool_cap / pool_backpressure_wait instruments
# emitted by PoolBudget. Lifted alongside the budget itself so the
# product crates (core-stream / core-block) don't need to wrap the gate in a
# callback.
shared-telemetry = { path = "../telemetry" }

# First-party alerting: emit a backpressure-timeout alert when the
# pool gate refuses a reservation past `backpressure_max_wait_seconds`.
# Producer side; the dispatcher is process-global so no channel
# needs threading through the budget.
shared-alerting = { path = "../alerting" }

# DiskCacheSize parses out of YAML as either an integer GB count
# or the literal "auto" string; the per-backend disk_cache_size_gb
# override under `storage.backends:` uses the same shape. Custom
# Deserialize on the enum needs serde.
serde = { version = "1", features = ["derive"] }

# Async backpressure path (try_reserve_async): a tokio::sync::Notify
# wakes async reservers without parking a runtime worker on the sync
# condvar, plus tokio::time for the deadline. The sync try_reserve path
# (Mutex+Condvar) stays for non-async callers.
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
