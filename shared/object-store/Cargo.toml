[package]
name = "shared-object-store"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Cache-wrapper telemetry: hit / coalesce / warmup counters fire
# from caching.rs through the process-global handle. record::*
# helpers no-op when the global is unset (CLI / unit tests).
shared-telemetry = { path = "../telemetry" }

# Shared infrastructure (matches core-mediachanger's profile so the
# moved files compile with no import diff beyond the error type).
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Compression (chunk-level pre-upload; same primitives drive
# tape-side compression in core-mediachanger but the bytes-in / bytes-out
# functions live here so cloud backends can compress without a
# circular dep).
zstd = "0.13"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }

# Decorrelated-jitter backoff for the retry loop.
rand = "0.9"

# DiskCacheSize is reused on the per-entry `disk_cache_size_gb`
# override under `cloud.backends:` (same shape as the YAML default —
# the two parsers can't drift).
shared-pool = { path = "../pool" }

# AWS SDK for S3. default-features = false drops the `rustls` and
# `sso` features; `rustls` enables the legacy rustls 0.21 path
# (rustls-webpki 0.101 — flagged by Dependabot) and we use the
# `default-https-client` modern rustls path instead. `sso` is
# unused (we authenticate via docs/AUTH.md flows, not AWS
# SSO) and pulls the same legacy path through aws-sdk-sso /
# ssooidc / sts defaults.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio", "behavior-version-latest"] }

# Google Cloud Storage SDK. Migrated 2026-05-11 from yoshidan's
# `gcloud-storage` 1.x (the community crate, formerly named
# `google-cloud-storage` 0.x before yoshidan donated the crate name
# to Google) to Google's official `google-cloud-storage` 1.x line
# (googleapis/google-cloud-rust). Aligns with how S3 (`aws-sdk-s3`)
# and Azure (`azure_storage_blob` / `azure_identity`) already use
# their respective vendors' official SDKs. Two-client shape:
# `Storage` for object I/O (read/write), `StorageControl` for the
# metadata plane (get/list/delete/update + bucket-level ops). Auth
# moves to `google-cloud-auth`, which keeps ADC chain semantics
# (GOOGLE_APPLICATION_CREDENTIALS → gcloud user → metadata server).
google-cloud-storage = "1.12"
google-cloud-auth = "1.10"
google-cloud-wkt = "1.4"           # FieldMask for UpdateObject (not re-exported)
google-cloud-gax = "1.10"          # ItemPaginator trait for ListObjects pagination
# rustls explicit dep: aws-sdk-s3 brings in aws-lc-rs and other tree paths
# bring in ring; rustls 0.23's auto-provider selection panics when both are
# present. Install the aws-lc-rs default once at first GcsBackend::new().
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Azure Blob Storage SDK + ARM management-plane queries (immutability
# policy lives on management.azure.com — the data-plane crate doesn't
# expose it). Migrated 2026-05-10 from the legacy unofficial
# (yoshidan-style) `azure_storage` + `azure_storage_blobs` 0.21
# line to Microsoft's official `azure_storage_blob` (singular)
# 0.12 + `azure_core` / `azure_identity` 0.35 line — clears the
# `rand 0.7.3` Dependabot alert (transitive via the legacy
# `http-types 2.12` dep) and aligns with the SDK Microsoft is
# actively investing in. Bearer-token-only credential model: SAS
# is encoded in the URL, AAD is `Arc<dyn TokenCredential>`,
# storage-account shared-key auth is no longer supported by the
# new SDK.
azure_core = "0.35"
azure_storage_blob = "0.12"
azure_identity = "0.35"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Force vendored openssl across the dep graph (same rationale as
# core-mediachanger: reqwest's transitive native-tls feature pulls
# openssl-sys; vendoring statically links it so one binary runs on
# every distro regardless of system openssl version).
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
# test-util enables tokio::test(start_paused = true) so retry tests
# don't burn 30 s of real sleep per case waiting out the exponential
# backoff.
tokio = { version = "1", features = ["test-util"] }
# In-process HTTP mock server for SDK-shape error classification tests
# (S3/Azure error responses → classify → FailureKind).
wiremock = "0.6"
# Used only by `examples/bench.rs` (the first-party throughput
# benchmark). Pinned to the same version the CLI crates use so any
# clap-API drift is felt in one place. Dev-only — the daemon binary
# never sees clap.
clap = { version = "4.5", features = ["derive"] }
# `examples/bench.rs` is a thin wrapper around the engine. The CLI
# subcommands depend on the same crate; keeping it dev-only here
# avoids pulling it into the daemon's binary.
shared-object-store-bench = { path = "../object-store-bench" }
