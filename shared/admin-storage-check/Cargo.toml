[package]
name = "shared-admin-storage-check"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Cross-product storage-backend reachability checks. Both daemons
# (thurvtl, thurvsa) route the `system.storage_check` job kind here and
# spawn the opt-in periodic reachability ticker from their main loops;
# the only per-product input is the parsed `ObjectStoreConfig`, passed
# in as an `Arc`. Kept out of `shared-object-store` (which owns the
# underlying `validate_object_store_backend` probe) so that lower-level
# crate stays free of the `JobEmitter` job-protocol + `shared-alerting`
# deps — the same split as `shared-admin-audit` / `shared-admin-monitor`.

[dependencies]
shared-admin-server = { path = "../admin-server" }
shared-object-store = { path = "../object-store" }
shared-alerting = { path = "../alerting" }

serde_json = "1"
# The periodic ticker uses tokio::time::interval.
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# Multi-thread runtime + macros to drive the job handler / ticker in tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
