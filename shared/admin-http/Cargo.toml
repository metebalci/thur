[package]
name = "shared-admin-http"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.7"
# 0.8 dropped the unmaintained `rustls-pemfile` (RUSTSEC-2025-0134)
# for `rustls-pki-types`' `PemObject`; PEM parsing here uses the same.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
hex = "0.4"
nix = { version = "0.29", default-features = false, features = ["hostname"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "sync"] }
tracing = "0.1"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
