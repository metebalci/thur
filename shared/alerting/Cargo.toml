[package]
name = "shared-alerting"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Cross-product first-party alerting. Both daemons (thurvtld,
# thurvsad) build an `AlertChannel` at boot when
# `alerting.enabled: true` is set in their YAML, install it as the
# process-global handle (mirror of `shared_telemetry::set_global`),
# and the producer crates (shared-audit writer task, shared-iscsi
# CHAP path, core-stream / core-block disk-cache loops) emit Alerts
# through the `record::*` free functions.
#
# Sinks shipped in v1: SMTP (via lettre) and generic webhook
# (HTTP POST with a Tera-templated body so one code path covers
# PagerDuty / Slack / Discord / ntfy / ServiceNow). Per-event-class
# dedup uses shared-audit's `AuditRateLimiter` so we don't double-
# implement the windowing.

[features]
# Optional axum router/handler for the `/api/v1/system/alerting`
# endpoint. Enabled by daemons that want to mount it on their HTTP
# server; off by default so CLI / build.rs callers don't pull axum.
http = ["dep:axum"]

[dependencies]
shared-admin-server = { path = "../admin-server" }
shared-audit = { path = "../audit" }
shared-naming = { path = "../naming" }
shared-telemetry = { path = "../telemetry" }

anyhow = "1"
axum = { version = "0.7", optional = true }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "rustls-tls",
    "builder",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = { version = "1", default-features = false }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
