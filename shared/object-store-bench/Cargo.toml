[package]
name = "shared-object-store-bench"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Trait + types the bench drives. The `run_from_config_path` entry
# point parses a daemon YAML conffile into an `ObjectStoreConfig`,
# then constructs each named backend via
# `ObjectStoreConfig::create_backend_named` and hands the lot to `run`
# as a list of `BenchTarget`s.
shared-object-store = { path = "../object-store" }

bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
# Temp config files for the load_storage_config / run_from_config_path tests.
tempfile = "3"
# In-crate MockStorageBackend impl for driving run() / bench_cell() / sweep
# paths without a real storage target.
async-trait = "0.1"
