[package]
name = "shared-telemetry"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "grpc-tonic", "http-proto", "reqwest-rustls"] }
opentelemetry-prometheus = "0.32"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
# default-features = false drops the `protobuf` feature: we only emit
# the text exposition format (TextEncoder) at /metrics, never the
# legacy protobuf format. Dropping it removes the protobuf 3.7.2 +
# protobuf-codegen build-dep — and with them the last consumer of
# thiserror 1.x in the tree, so thiserror collapses to a single
# (2.x) version.
prometheus = { version = "0.14", default-features = false }
thiserror = "2"
tonic = { version = "0.14", default-features = false }
tracing = "0.1"
# Lock-free read-mostly per-backend counter maps for LiveStats: the
# chunk-seal hot path resolves a backend's `Arc<Counters>` via a
# `load()` (no mutex, no per-call key allocation) — issue #271. Already
# in the workspace graph (shared-admin-auth's AuthState).
arc-swap = "1"

# Optional axum metrics-handler. Enabled by daemons that mount
# `/metrics` on their TCP HTTP server; off by default so CLI / non-HTTP
# consumers don't pay the axum compile cost.
axum = { version = "0.7", optional = true }

[features]
default = []
http = ["dep:axum"]
