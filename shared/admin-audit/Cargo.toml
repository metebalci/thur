[package]
name = "shared-admin-audit"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Cross-product `system.audit.*` job handlers (tail / export / verify
# / rotate). Both daemons (thurvtl, thurvsa) route these job kinds
# here; the only per-product variation is the audit directory path,
# passed in as a plain `PathBuf` argument. Kept out of `shared-audit`
# itself so that low-level crate stays free of the `JobEmitter` /
# job-protocol deps.

[dependencies]
shared-admin-server = { path = "../admin-server" }
shared-audit = { path = "../audit" }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `run_tail` follow mode polls today's JSONL file on a timer.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
# Multi-thread runtime + macros to drive the job handlers in tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
