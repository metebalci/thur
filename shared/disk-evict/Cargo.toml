[package]
name = "shared-disk-evict"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Cross-product disk-cache eviction-worker primitives. The two daemons'
# eviction loops were near-identical (the `auto`-mode cap-resolution
# half byte-for-byte); the genuinely shared pieces live here so they
# can't drift. The per-product wakeup source (VTL: upload-completion
# Notify + backstop; VSA: interval) and the actual evict call (VTL's
# async cloud-backup evict vs VSA's sync fs-only evict) stay in each
# daemon — only the cap-resolution and the within-budget alert/log
# decision are lifted.

[dependencies]
# DiskCacheSize / DiskCacheBounds / PoolBudget — the cap-resolution
# inputs and the budget the resolved cap is pushed into.
shared-pool = { path = "../pool" }
# ObjectStoreConfig::{backend_entry,disk_cache_size_gb} for per-entry
# cap overrides.
shared-object-store = { path = "../object-store" }
# Soft-watermark alert fired when a pool sits above its watermark.
shared-alerting = { path = "../alerting" }

tracing = "0.1"

[dev-dependencies]
tempfile = "3"
