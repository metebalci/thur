[package]
name = "shared-upload-worker"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Backend trait + DedupScope enum that `upload_chunk_inert` keys its
# HEAD-probe decision off.
shared-object-store = { path = "../object-store" }

# Per-backend HEAD-probe / upload-bytes counters fired from
# `upload_chunk_inert`. record::* helpers no-op when the global handle
# is unset (CLI / tests), so this dependency is cheap for non-daemon
# consumers.
shared-telemetry = { path = "../telemetry" }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["fs", "rt", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
