apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thurvsa-csi.controllerServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thurvsa-csi.nodeServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
---
# Cluster-wide permissions for the controller sidecars (provisioner, attacher,
# resizer, snapshotter), unioned into one role for a single-driver install.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "thurvsa-csi.fullname" . }}-controller
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  # Snapshotter
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch", "create", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "thurvsa-csi.fullname" . }}-controller
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "thurvsa-csi.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "thurvsa-csi.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
---
# The driver itself manages per-volume CHAP Secrets in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "thurvsa-csi.fullname" . }}-chap-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "thurvsa-csi.fullname" . }}-chap-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "thurvsa-csi.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "thurvsa-csi.fullname" . }}-chap-secrets
  apiGroup: rbac.authorization.k8s.io
