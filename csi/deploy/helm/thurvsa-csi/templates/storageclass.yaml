{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "thurvsa-csi.labels" . | nindent 4 }}
  {{- if .Values.storageClass.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ .Values.driver.name }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
volumeBindingMode: Immediate
parameters:
  {{- with .Values.storageClass.parameters }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- if .Values.iscsi.targetPortal }}
  targetPortal: {{ .Values.iscsi.targetPortal | quote }}
  {{- end }}
{{- end }}
