apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thurvsa-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: thurvsa
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: thurvsa-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo hello > /data/hello && sleep 3600"]
      volumeMounts:
        - name: vol
          mountPath: /data
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: thurvsa-demo
