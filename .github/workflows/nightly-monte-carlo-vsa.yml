name: nightly-monte-carlo-vsa

# Seeded random-op test driving ext4 on a thurvsa volume over iSCSI.
# Each run picks a fresh seed from /dev/urandom, prints it on start,
# and any failure is reproducible via --seed N — running nightly grows
# the seed corpus over time. ~5 min wall-clock default (3000 ops).
# Transport fixed to iSCSI for now; NVMe/TCP would be a second matrix
# entry once it's stable on hosted runners.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: apt prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs util-linux sg3-utils open-iscsi lsscsi openssl curl

      - name: start iscsid
        run: sudo systemctl enable --now iscsid

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build release binaries
        run: cargo build --release -p vsa-daemon -p vsa-cli

      # --keep-data so the test's cleanup trap doesn't rm -rf the tmp
      # dir before the upload step runs (CI runners are ephemeral, so
      # keeping data has no downside). Daemon stays at the default info
      # log level.
      - name: run monte-carlo
        run: ./vsa/scripts/test-monte-carlo.sh --keep-data

      # Host-side device failures report their sense data into the
      # kernel ring buffer, which outlives the test's iSCSI logout.
      # Capture it (plus iscsid's journal, the device map, and tool
      # versions) so the daemon-side log and the kernel-side view can
      # be cross-read without re-running.
      - name: capture host diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/mc-diag
          sudo dmesg -T > /tmp/mc-diag/dmesg-vsa.txt 2>&1 || true
          sudo journalctl -u iscsid --no-pager > /tmp/mc-diag/iscsid-vsa.txt 2>&1 || true
          { lsscsi -g; echo; lsscsi -t; } > /tmp/mc-diag/lsscsi-vsa.txt 2>&1 || true
          { uname -a; dpkg -l | grep -E 'open-iscsi|sg3-utils|e2fsprogs|lsscsi'; } \
            > /tmp/mc-diag/env-vsa.txt 2>&1 || true

      # Preserve the op log + daemon log + host diagnostics on failure
      # so the seed printed in the run output can be reproduced + the
      # cause is available without re-running.
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-vsa-${{ github.run_id }}
          path: |
            /tmp/thurvsa-monte-carlo-*/ops.log
            /tmp/thurvsa-monte-carlo-*/daemon.log
            /tmp/mc-diag/*
          retention-days: 30
          if-no-files-found: ignore
