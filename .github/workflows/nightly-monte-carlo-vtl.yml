name: nightly-monte-carlo-vtl

# Seeded random-op test against a small VTL chassis (1 drive,
# 4 cartridges, 1 IE element). Each run picks a fresh seed from
# /dev/urandom, prints it on start, and any failure is reproducible
# via --seed N — running nightly grows the seed corpus over time.
# ~5 min wall-clock default (3000 ops).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: apt prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtx mt-st sg3-utils open-iscsi lsscsi openssl curl

      - name: start iscsid
        run: sudo systemctl enable --now iscsid

      # GitHub's hosted runners don't auto-load the SCSI tape (st)
      # kernel module, so the emulated LTO drives attach only as
      # scsi-generic (sgN) nodes and never get /dev/nstN — every mt / dd
      # tape op then fails host-side before reaching the daemon. mtx
      # keeps working (it drives the changer's sg node), which is why
      # only the drive ops failed. Load st explicitly before the test.
      - name: load SCSI tape driver (st)
        run: |
          sudo modprobe st \
            || (sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe st)
          lsmod | grep -qE '^st\s' || { echo "st (SCSI tape) module not loaded"; exit 1; }

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build release binaries
        run: cargo build --release -p vtl-daemon -p vtl-cli

      # --keep-data so the test's cleanup trap doesn't rm -rf the tmp
      # dir before the upload step runs (CI runners are ephemeral, so
      # keeping data has no downside). RUST_LOG bumps the tape + changer
      # SCSI dispatch to debug so a failed REWIND / WRITE FILEMARK /
      # MOVE MEDIUM logs its CDB + returned sense daemon-side; the iSCSI
      # transport stays at info to avoid a per-PDU firehose.
      - name: run monte-carlo
        env:
          RUST_LOG: "info,scsi_ssc=debug,scsi_smc=debug"
        run: ./vtl/scripts/test-monte-carlo.sh --keep-data

      # Host-side mt / mtx failures report their sense data into the
      # kernel ring buffer, which outlives the test's iSCSI logout.
      # Capture it (plus iscsid's journal, the device map, and tool
      # versions) so the daemon-side log and the kernel-side view can
      # be cross-read without re-running.
      - name: capture host diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/mc-diag
          sudo dmesg -T > /tmp/mc-diag/dmesg-vtl.txt 2>&1 || true
          sudo journalctl -u iscsid --no-pager > /tmp/mc-diag/iscsid-vtl.txt 2>&1 || true
          { lsscsi -g; echo; lsscsi -t; } > /tmp/mc-diag/lsscsi-vtl.txt 2>&1 || true
          { uname -a; dpkg -l | grep -E 'open-iscsi|sg3-utils|mtx|mt-st|lsscsi'; } \
            > /tmp/mc-diag/env-vtl.txt 2>&1 || true

      # Preserve the op log + daemon log + host diagnostics on failure
      # so the seed printed in the run output can be reproduced + the
      # cause is available without re-running.
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-vtl-${{ github.run_id }}
          path: |
            /tmp/thurvtl-monte-carlo-*/ops.log
            /tmp/thurvtl-monte-carlo-*/daemon.log
            /tmp/mc-diag/*
          retention-days: 30
          if-no-files-found: ignore
