name: nightly-monte-carlo-vtl

# Seeded random-op test against a small VTL chassis (3 drives,
# 8 cartridges, 12 storage slots, 1 IE element). Each run picks a fresh
# seed from /dev/urandom, prints it on start, and any failure is
# reproducible via --seed N. The job first replays the regression seed
# corpus (vtl/scripts/seeds.txt) — seeds that ever caught a bug, pinned
# forever — then runs a 3000-op soak (--ops 3000) with a fresh seed;
# roughly 5-8 min wall-clock.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: apt prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtx mt-st sg3-utils open-iscsi lsscsi openssl curl

      - name: start iscsid
        run: sudo systemctl enable --now iscsid

      # GitHub's hosted runners don't auto-load the SCSI tape (st)
      # kernel module, so the emulated LTO drives attach only as
      # scsi-generic (sgN) nodes and never get /dev/nstN — every mt / dd
      # tape op then fails host-side before reaching the daemon. mtx
      # keeps working (it drives the changer's sg node), which is why
      # only the drive ops failed. Load st explicitly before the test.
      - name: load SCSI tape driver (st)
        run: |
          sudo modprobe st \
            || (sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe st)
          lsmod | grep -qE '^st\s' || { echo "st (SCSI tape) module not loaded"; exit 1; }

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build release binaries
        run: cargo build --release -p vtl-daemon -p vtl-cli

      # Regression guard: replay every seed in the corpus (--quick)
      # before the fresh random run. Seeds that ever caught a bug live
      # in vtl/scripts/seeds.txt and are pinned here forever.
      - name: replay seed corpus
        run: |
          while read -r seed _rest; do
            case "$seed" in ''|\#*) continue ;; esac
            echo "::group::replay seed $seed"
            ./vtl/scripts/test-monte-carlo.sh --seed "$seed" --quick --keep-data
            echo "::endgroup::"
          done < vtl/scripts/seeds.txt

      # --keep-data so the test's cleanup trap doesn't rm -rf the tmp
      # dir before the upload step runs (CI runners are ephemeral, so
      # keeping data has no downside). Daemon stays at the default info
      # log level.
      - name: run monte-carlo
        run: ./vtl/scripts/test-monte-carlo.sh --keep-data --ops 3000

      # Host-side mt / mtx failures report their sense data into the
      # kernel ring buffer, which outlives the test's iSCSI logout.
      # Capture it (plus iscsid's journal, the device map, and tool
      # versions) so the daemon-side log and the kernel-side view can
      # be cross-read without re-running.
      - name: capture host diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/mc-diag
          sudo dmesg -T > /tmp/mc-diag/dmesg-vtl.txt 2>&1 || true
          sudo journalctl -u iscsid --no-pager > /tmp/mc-diag/iscsid-vtl.txt 2>&1 || true
          { lsscsi -g; echo; lsscsi -t; } > /tmp/mc-diag/lsscsi-vtl.txt 2>&1 || true
          { uname -a; dpkg -l | grep -E 'open-iscsi|sg3-utils|mtx|mt-st|lsscsi'; } \
            > /tmp/mc-diag/env-vtl.txt 2>&1 || true
          # Capture the exact corruption for offline analysis: the diverging
          # bytes of the last (failing) read_verify plus the cartridge's
          # on-disk state (chunks.idx / block index / manifest / chunk pool),
          # so chunk_id -> hash -> bytes can be reconstructed without a
          # re-run. The replay-corpus step runs with --keep-data, so the test
          # dir (incl. scratch.expect / scratch.actual) survives.
          for d in /tmp/thurvtl-monte-carlo-*/; do
            [ -f "$d/scratch.expect" ] || continue
            xxd "$d/scratch.expect" | head -64 > /tmp/mc-diag/expect.hex 2>&1 || true
            xxd "$d/scratch.actual" | head -64 > /tmp/mc-diag/actual.hex 2>&1 || true
            { echo "expect_size=$(stat -c%s "$d/scratch.expect") actual_size=$(stat -c%s "$d/scratch.actual")";
              echo "--- cmp -l (byte: expect actual, octal) ---";
              cmp -l "$d/scratch.expect" "$d/scratch.actual" 2>&1 | head -200; } \
              > /tmp/mc-diag/cmp.txt 2>&1 || true
            tar czf /tmp/mc-diag/cartridge-state.tgz -C "$d" data 2>/dev/null || true
          done

      # Preserve the op log + daemon log + host diagnostics on failure
      # so the seed printed in the run output can be reproduced + the
      # cause is available without re-running.
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-vtl-${{ github.run_id }}
          path: |
            /tmp/thurvtl-monte-carlo-*/ops.log
            /tmp/thurvtl-monte-carlo-*/daemon.log
            /tmp/mc-diag/*
          retention-days: 30
          if-no-files-found: ignore
