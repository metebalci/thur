name: monte-carlo-multi-vtl

# Multi-initiator companion to nightly-monte-carlo-vtl. Two distinct
# iSCSI initiator IQNs concurrently drive disjoint drive sets against
# a single thurvtl daemon (4 drives, 6 carts) via per-CHAP-user
# logical partition admission. Each session locks only the drives
# its partition owns, so the two streams hold disjoint subsets.
# Schedule offsets from the single-initiator nightly so they don't
# fight for runners.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: apt prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtx mt-st sg3-utils open-iscsi lsscsi openssl curl

      - name: start iscsid
        run: sudo systemctl enable --now iscsid

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build release binaries
        run: cargo build --release -p vtl-daemon -p vtl-cli

      - name: run monte-carlo (multi-initiator)
        run: ./vtl/scripts/test-monte-carlo-multi.sh

      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-multi-vtl-${{ github.run_id }}
          path: |
            /tmp/thurvtl-monte-carlo-multi-*/ops*.log
            /tmp/thurvtl-monte-carlo-multi-*/daemon.log
          retention-days: 30
          if-no-files-found: ignore
