name: container

# Tag-triggered multi-arch container build for both products. Mirrors
# release.yml's trigger + SemVer pre-release convention (a `v*-*` tag is a
# pre-release), and publishes to GHCR:
#
#   ghcr.io/<owner>/thurvtl  and  ghcr.io/<owner>/thurvsa
#
# amd64 builds on a standard runner and arm64 on a native arm64 runner
# (free for public repos) — no QEMU emulation of the Rust compile. Each
# arch is pushed by digest, then a manifest list ties them under the
# human tags. The arm64 image is the artifact issue #83 (Apple Silicon /
# Mac mini) runs in a VM.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build images for'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: build ${{ matrix.product }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        product: [thurvtl, thurvsa]
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # CLI build.rs stamps the version from git history

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: release/Containerfile
          build-args: |
            PRODUCT=${{ matrix.product }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_BASE }}/${{ matrix.product }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.product }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.product }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [thurvtl, thurvsa]
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.product }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_BASE}/${{ matrix.product }}"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Always tag the exact version. A non-pre-release also floats
          # major.minor and latest; a `v*-*` pre-release tag gets neither.
          TAGFLAGS=(-t "${IMAGE}:${VERSION}")
          case "$TAG" in
            v*-*) : ;;
            *) TAGFLAGS+=(-t "${IMAGE}:${VERSION%.*}" -t "${IMAGE}:latest") ;;
          esac
          cd /tmp/digests
          SRCS=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create "${TAGFLAGS[@]}" ${SRCS}
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
