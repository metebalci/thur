name: monte-carlo-multi-vsa

# Multi-initiator companion to nightly-monte-carlo-vsa. Two distinct
# iSCSI initiator IQNs concurrently drive their own pair of volumes
# against a single thurvsad daemon (4 volumes total, 2/initiator).
# Exercises per-CHAP-user volume admission, per-volume PageCache
# isolation, write-back ordering, and multi-LUN-per-session SCSI
# dispatch under concurrent host traffic.

on:
  schedule:
    # 04:00 UTC daily, 30 min after the single-initiator nightly
    # (03:30 UTC) so the two don't fight for cache / CPU on the
    # shared runner.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo-multi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: apt prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs util-linux sg3-utils open-iscsi lsscsi openssl curl

      - name: start iscsid
        run: sudo systemctl enable --now iscsid

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: build release binaries
        run: cargo build --release -p vsa-daemon -p vsa-cli

      # --keep-data so the test's cleanup trap doesn't rm -rf the tmp
      # dir before the upload step runs (CI runners are ephemeral, so
      # keeping data has no downside). RUST_LOG bumps the block SCSI
      # dispatch + block core to debug so a failed data-path command
      # logs its CDB + returned sense daemon-side; the iSCSI transport
      # stays at info to avoid a per-PDU firehose.
      - name: run monte-carlo (multi-initiator)
        env:
          RUST_LOG: "info,scsi_sbc=debug,core_block=debug"
        run: ./vsa/scripts/test-monte-carlo-multi.sh --keep-data

      # Host-side device failures report their sense data into the
      # kernel ring buffer, which outlives the test's iSCSI logout.
      # Capture it (plus iscsid's journal, the device map, and tool
      # versions) so the daemon-side log and the kernel-side view can
      # be cross-read without re-running.
      - name: capture host diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/mc-diag
          sudo dmesg -T > /tmp/mc-diag/dmesg-vsa.txt 2>&1 || true
          sudo journalctl -u iscsid --no-pager > /tmp/mc-diag/iscsid-vsa.txt 2>&1 || true
          { lsscsi -g; echo; lsscsi -t; } > /tmp/mc-diag/lsscsi-vsa.txt 2>&1 || true
          { uname -a; dpkg -l | grep -E 'open-iscsi|sg3-utils|e2fsprogs|lsscsi'; } \
            > /tmp/mc-diag/env-vsa.txt 2>&1 || true

      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-multi-vsa-${{ github.run_id }}
          path: |
            /tmp/thurvsa-monte-carlo-multi-*/ops*.log
            /tmp/thurvsa-monte-carlo-multi-*/daemon.log
            /tmp/mc-diag/*
          retention-days: 30
          if-no-files-found: ignore
